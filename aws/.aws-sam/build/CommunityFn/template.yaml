AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Confession Roulette — Hybrid AWS + Firebase Serverless Backend.
  Replaces the monolithic server/index.js with discrete Lambda functions
  orchestrated by API Gateway, EventBridge, and SQS.

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        AWS_REGION_OVERRIDE: !Ref AWS::Region

# ─── Parameters ──────────────────────────────────────────────────────────────
Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway deployment stage name

# ─── Resources ───────────────────────────────────────────────────────────────
Resources:

  # ── SQS: Expiry Queue (delayed message queue) ─────────────────────────────
  ExpiryQueue:
    Type: AWS::SQS::Queue
    Properties:

      VisibilityTimeout: 120          # Must be >= Lambda timeout × 6
      MessageRetentionPeriod: 3600    # Keep failed messages for 1 hour
      # No DelaySeconds here — delay is set per-message by the drop scheduler

  # ── IAM Role for Lambda Functions ──────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: confession-lambda-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # SQS — send + receive
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ExpiryQueue.Arn
              # AWS Comprehend — toxicity detection
              - Effect: Allow
                Action:
                  - comprehend:DetectToxicContent
                Resource: "*"
              # API Gateway Management API — WebSocket broadcast
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/@connections/*"

  # ── HTTP API (API Gateway v2) ──────────────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  # ── WebSocket API (API Gateway v2) ─────────────────────────────────────────
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-ws-api"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref StageName
      AutoDeploy: true

  # ── Lambda: Moderate (POST /confess) ───────────────────────────────────────
  ModerateFn:
    Type: AWS::Serverless::Function
    Properties:

      Handler: functions/moderate/index.handler
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          EXPIRY_QUEUE_URL: !Ref ExpiryQueue
      Events:
        PostConfess:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /confess
            Method: POST

  # ── Lambda: Drop Scheduler (EventBridge — fallback every 1 minute) ─────────
  DropSchedulerFn:
    Type: AWS::Serverless::Function
    Properties:

      Handler: functions/drop-scheduler/index.handler
      Timeout: 60
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          EXPIRY_QUEUE_URL: !Ref ExpiryQueue
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  # ── Lambda: Expiry Sweeper (SQS trigger) ───────────────────────────────────
  ExpirySweeperFn:
    Type: AWS::Serverless::Function
    Properties:

      Handler: functions/expiry-sweeper/index.handler
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ExpiryQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ExpiryQueue.Arn
            BatchSize: 1

  # ── Lambda: Community (POST /community/join, GET /community/stats) ─────────
  CommunityFn:
    Type: AWS::Serverless::Function
    Properties:
      Handler: functions/community/index.handler
      Timeout: 15
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        PostCommunityJoin:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /community/join
            Method: POST
        GetCommunityStats:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /community/stats
            Method: GET

  # ── Lambda: Report Handler (POST /report) ──────────────────────────────────
  ReportHandlerFn:
    Type: AWS::Serverless::Function
    Properties:

      Handler: functions/report-handler/index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        PostReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /report
            Method: POST

  # ── Lambda: Hall of Fame Rollup (EventBridge cron — every 60 minutes) ──────
  HallOfFameRollupFn:
    Type: AWS::Serverless::Function
    Properties:

      Handler: functions/hall-of-fame/index.handler
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        EveryHour:
          Type: Schedule
          Properties:
            Schedule: rate(60 minutes)
            Enabled: true

  # ── Lambda: WebSocket Connect ($connect) ───────────────────────────────────
  WsConnectFn:
    Type: AWS::Serverless::Function
    Properties:

      Handler: functions/ws-connect/index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn

  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFn.Arn}/invocations"

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub "integrations/${WsConnectIntegration}"

  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WsConnectFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$connect"

  # ── Lambda: WebSocket Message ($default) ───────────────────────────────────
  WsMessageFn:
    Type: AWS::Serverless::Function
    Properties:

      Handler: functions/ws-message/index.handler
      Timeout: 10
      Role: !GetAtt LambdaExecutionRole.Arn

  WsMessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsMessageFn.Arn}/invocations"

  WsMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub "integrations/${WsMessageIntegration}"

  WsMessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WsMessageFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$default"

  # ── Lambda: WebSocket Disconnect ($disconnect) ─────────────────────────────
  WsDisconnectFn:
    Type: AWS::Serverless::Function
    Properties:

      Handler: functions/ws-disconnect/index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn

  WsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFn.Arn}/invocations"

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${WsDisconnectIntegration}"

  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WsDisconnectFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$disconnect"

# ─── Outputs ─────────────────────────────────────────────────────────────────
Outputs:
  HttpApiUrl:
    Description: HTTP API Gateway base URL (for client VITE_API_URL)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"

  WebSocketUrl:
    Description: WebSocket API Gateway URL (for client VITE_WS_URL)
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"

  ExpiryQueueUrl:
    Description: SQS Expiry Queue URL
    Value: !Ref ExpiryQueue
