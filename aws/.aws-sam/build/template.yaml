AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Confession Roulette \u2014 Hybrid AWS + Firebase Serverless Backend.\
  \ Replaces the monolithic server/index.js with discrete Lambda functions orchestrated\
  \ by API Gateway, EventBridge, and SQS.\n"
Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        AWS_REGION_OVERRIDE:
          Ref: AWS::Region
Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway deployment stage name
Resources:
  ExpiryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: confession-expiry-queue
      VisibilityTimeout: 120
      MessageRetentionPeriod: 3600
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: confession-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: confession-lambda-policy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Fn::GetAtt:
              - ExpiryQueue
              - Arn
          - Effect: Allow
            Action:
            - comprehend:DetectToxicContent
            Resource: '*'
          - Effect: Allow
            Action:
            - execute-api:ManageConnections
            Resource:
              Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:*/@connections/*
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName:
        Ref: StageName
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowHeaders:
        - Content-Type
        - Authorization
        AllowMethods:
        - POST
        - OPTIONS
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: confession-ws-api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: WebSocketApi
      StageName:
        Ref: StageName
      AutoDeploy: true
  ModerateFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: confession-moderate
      Handler: functions/moderate/index.handler
      Timeout: 30
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Events:
        PostConfess:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /confess
            Method: POST
      CodeUri: ModerateFn
    Metadata:
      SamResourceId: ModerateFn
  DropSchedulerFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: confession-drop-scheduler
      Handler: functions/drop-scheduler/index.handler
      Timeout: 60
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Environment:
        Variables:
          EXPIRY_QUEUE_URL:
            Ref: ExpiryQueue
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true
      CodeUri: DropSchedulerFn
    Metadata:
      SamResourceId: DropSchedulerFn
  ExpirySweeperFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: confession-expiry-sweeper
      Handler: functions/expiry-sweeper/index.handler
      Timeout: 30
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Events:
        ExpiryQueueEvent:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - ExpiryQueue
              - Arn
            BatchSize: 1
      CodeUri: ExpirySweeperFn
    Metadata:
      SamResourceId: ExpirySweeperFn
  ReportHandlerFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: confession-report-handler
      Handler: functions/report-handler/index.handler
      Timeout: 10
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Events:
        PostReport:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /report
            Method: POST
      CodeUri: ReportHandlerFn
    Metadata:
      SamResourceId: ReportHandlerFn
  HallOfFameRollupFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: confession-hall-of-fame
      Handler: functions/hall-of-fame/index.handler
      Timeout: 30
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Events:
        EveryHour:
          Type: Schedule
          Properties:
            Schedule: rate(60 minutes)
            Enabled: true
      CodeUri: HallOfFameRollupFn
    Metadata:
      SamResourceId: HallOfFameRollupFn
  WsConnectFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: confession-ws-connect
      Handler: functions/ws-connect/index.handler
      Timeout: 10
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: WsConnectFn
    Metadata:
      SamResourceId: WsConnectFn
  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFn.Arn}/invocations
  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $connect
      Target:
        Fn::Sub: integrations/${WsConnectIntegration}
  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WsConnectFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$connect
  WsMessageFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: confession-ws-message
      Handler: functions/ws-message/index.handler
      Timeout: 10
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: WsMessageFn
    Metadata:
      SamResourceId: WsMessageFn
  WsMessageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsMessageFn.Arn}/invocations
  WsMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $default
      Target:
        Fn::Sub: integrations/${WsMessageIntegration}
  WsMessagePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WsMessageFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$default
  WsDisconnectFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: confession-ws-disconnect
      Handler: functions/ws-disconnect/index.handler
      Timeout: 10
      MemorySize: 128
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      CodeUri: WsDisconnectFn
    Metadata:
      SamResourceId: WsDisconnectFn
  WsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFn.Arn}/invocations
  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: WebSocketApi
      RouteKey: $disconnect
      Target:
        Fn::Sub: integrations/${WsDisconnectIntegration}
  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: WsDisconnectFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*/$disconnect
Outputs:
  HttpApiUrl:
    Description: HTTP API Gateway base URL (for client VITE_API_URL)
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  WebSocketUrl:
    Description: WebSocket API Gateway URL (for client VITE_WS_URL)
    Value:
      Fn::Sub: wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  ExpiryQueueUrl:
    Description: SQS Expiry Queue URL
    Value:
      Ref: ExpiryQueue
